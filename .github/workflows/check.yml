name: Build check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix functions
      - run: node --check functions/index.js
      - run: node --check functions/willhaben.mjs
      - run: npm run build
