name: Deploy to Firebase

on:
  push:
    branches: [main]
    # Docs-only changes don't need a redeploy.
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the running one.
concurrency:
  group: firebase-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm ci --prefix functions

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Enable only after Blaze billing, IAM roles and a manual Actions deploy have been verified.
      - name: Prepare Hosting without the optional import function
        if: vars.ENABLE_WILLHABEN_FUNCTION != 'true'
        run: node -e 'const fs = require("node:fs"); const config = JSON.parse(fs.readFileSync("firebase.json")); config.hosting.rewrites = config.hosting.rewrites.filter((r) => !r.function); delete config.functions; fs.writeFileSync("firebase.json", JSON.stringify(config));'

      - name: Deploy hosting and rules
        if: vars.ENABLE_WILLHABEN_FUNCTION != 'true'
        run: npx --yes firebase-tools@latest deploy --only hosting,firestore:rules --non-interactive

      - name: Deploy function, hosting and rules
        if: vars.ENABLE_WILLHABEN_FUNCTION == 'true'
        run: npx --yes firebase-tools@latest deploy --only functions,hosting,firestore:rules --non-interactive
